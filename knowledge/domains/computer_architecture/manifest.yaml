# computer_architecture domain manifest
#
# Lists the sub-folders under domains/computer_architecture/, what each covers,
# and whether it has been built yet. The domain router.skill uses this to decide
# which sub-folder router.skill to load for a given topic.
#
# status: built   -> router.skill + manifest.yaml + topic .skill files exist
# status: planned -> folder does not exist yet; router.skill should say so honestly

subdomains:
  foundations:
    covers:
      - number_representation
      - floating_point
      - boolean_algebra
      - c_memory_layout
    status: built

  isa:
    covers:
      - risc_v_instructions
      - instruction_formats
      - risc_vs_cisc
    status: built

  assembly:
    covers:
      - risc_v_assembly
      - calling_convention
    status: built

  logic:
    covers:
      - combinational_logic
      - synchronous_digital_systems
      - fsm
    status: built

  datapath:
    covers:
      - single_cycle_datapath
      - control_unit
    status: built

  pipeline:
    covers:
      - pipeline_overview
      - pipeline_register
      - pipeline_hazard
      - forwarding
      - stall
      - bubble
      - branch_prediction
      - speculation
    status: built

  cache:
    covers:
      - locality
      - memory_hierarchy
      - cache
    status: built

  virtual_memory:
    covers:
      - virtual_memory
      - page_table
      - tlb
    status: built

  performance:
    covers:
      - cpi
      - speedup
      - amdahls_law
    status: built

  parallel:
    covers:
      - multithreading
      - synchronization
      - cache_coherency
      - memory_model
    status: built

  linux:
    covers:
      - io_devices
      - interrupts
      - trap_handling
    status: built
    # scope note: CA course's "Linux Interaction" unit = hardware/OS interface
    # (I/O, interrupts, traps). NOT the full Linux kernel -- that's the
    # separate, still-planned top-level domains/linux/ (see ../../router.skill).

  practice:
    covers:
      - interview_question_bank
      - worked_problems
    status: built
    # not new concepts -- cross-references/compiles the other 11 sub-domains
    # into self-test material.

# All 12 sub-domains are now built (40 topic skills total). Cross-folder
# dependencies between sub-domains (e.g. pipeline/manifest.yaml ->
# datapath/single_cycle_datapath, virtual_memory -> cache, parallel ->
# performance/amdahls_law, linux -> virtual_memory/page_table) are noted
# inline in each affected topic skill/manifest rather than tracked centrally
# here -- there is no cross-sub-domain forward reference left unresolved.
