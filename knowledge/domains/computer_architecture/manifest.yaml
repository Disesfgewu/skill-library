# computer_architecture domain manifest
#
# Lists the sub-folders under domains/computer_architecture/, what each covers,
# and whether it has been built yet. The domain router.skill uses this to decide
# which sub-folder router.skill to load for a given topic.
#
# status: built   -> router.skill + manifest.yaml + topic .skill files exist
# status: planned -> folder does not exist yet; router.skill should say so honestly

subdomains:
  foundations:
    covers:
      - number_representation
      - floating_point
      - boolean_algebra
      - c_memory_layout
    status: built

  isa:
    covers: [risc-v-instructions, instruction-formats, risc-vs-cisc]
    status: planned

  assembly:
    covers: [risc-v-assembly, calling-convention]
    status: planned

  logic:
    covers:
      - combinational_logic
      - synchronous_digital_systems
      - fsm
    status: built

  datapath:
    covers:
      - single_cycle_datapath
      - control_unit
    status: built

  pipeline:
    covers:
      - pipeline_overview
      - pipeline_register
      - pipeline_hazard
      - forwarding
      - stall
      - bubble
      - branch_prediction
      - speculation
    status: built

  cache:
    covers: [locality, memory-hierarchy, cache-structure, miss-rate]
    status: planned

  virtual_memory:
    covers: [page-table, tlb]
    status: planned

  performance:
    covers: [cpi, speedup]
    status: planned

  parallel:
    covers: [multithreading, synchronization, cache-coherency, memory-model]
    status: planned

  linux:
    covers: [io-devices, polling, interrupts, trap-handling]
    status: planned

  practice:
    covers: [interview-question-sets, worked-problems]
    status: planned

# Cross-subdomain note: pipeline/manifest.yaml lists datapath/single_cycle_datapath
# as a conceptual dependency (pipeline is single_cycle_datapath split into
# overlapping stages). datapath/ is now built, so this is a real cross-folder
# reference rather than a forward reference to a "planned" folder.
